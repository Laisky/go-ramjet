name: gptchat-insert-regression-check

on:
  push:
    branches:
      - fix/gptchat-insert-user-boundaries

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install dependencies
        run: |
          corepack enable
          pnpm -C web install --frozen-lockfile
      - name: Show required formatting changes
        run: |
          pnpm -C web exec prettier --write src/pages/gptchat/__tests__/conversation-insert.test.tsx src/pages/gptchat/index.tsx
          git diff -- web/src/pages/gptchat/__tests__/conversation-insert.test.tsx web/src/pages/gptchat/index.tsx
      - name: Reproduce original rendering defect
        shell: bash
        run: |
          set +e
          pnpm -C web test src/pages/gptchat/__tests__/conversation-insert.test.tsx
          result=$?
          set -e
          if [[ "$result" -eq 0 ]]; then
            echo 'Expected the regression tests to fail on the original renderer'
            exit 1
          fi
      - name: Apply role guard in the isolated checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web/src/pages/gptchat/index.tsx')
          text = path.read_text()
          old = '{idx > 0 && ('
          assert text.count(old) == 1
          path.write_text(text.replace(old, "{idx > 0 && msg.role === 'user' && ("))
          PY
      - name: Verify regression tests with role guard
        run: pnpm -C web test src/pages/gptchat/__tests__/conversation-insert.test.tsx
      - name: Verify frontend lint and build
        run: |
          pnpm -C web lint
          pnpm -C web build
