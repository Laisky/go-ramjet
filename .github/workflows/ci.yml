name: ci

on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'test/ci'
    paths-ignore:
      - 'docs/**'
      - 'doc/**'
      - 'tests/**'
      - 'test/**'
      - 'ci/**'

jobs:
  check_skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - name: Check if CI should be skipped
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" =~ ^(docs:|doc:|tests:|test:|ci:) ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Skipping CI due to commit message prefix"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  build_latest:
    needs: check_skip
    if: needs.check_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: build_latest-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute short sha
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push (latest + hash)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ppcelery/go-ramjet:latest
            ppcelery/go-ramjet:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha

  build_latest_cache:
    needs: [check_skip, build_latest]
    if: needs.check_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: build_latest_cache-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export cache only
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [check_skip, build_latest]
    if: needs.check_skip.outputs.should_skip != 'true'
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TARGET_HOST }}
          username: ${{ secrets.TARGET_HOST_USERNAME }}
          password: ${{ secrets.TARGET_HOST_PASSWORD }}
          port: ${{ secrets.TARGET_HOST_SSH_PORT }}
          script: |
            bash -se <<'RAMJET_DEPLOY'
            set -Eeuo pipefail
            cd /home/laisky/repo/VPS
            compose_file=b1-docker-compose.yml
            image=ppcelery/go-ramjet:latest

            # Validate the modern Compose CLI and existing configuration before changes.
            compose_version="$(docker compose version --short)"
            compose_major="${compose_version#v}"
            compose_major="${compose_major%%.*}"
            if [[ ! "$compose_major" =~ ^[0-9]+$ ]] || (( 10#$compose_major < 2 )); then
              printf 'Modern Docker Compose is required; found %s\n' "$compose_version" >&2
              exit 1
            fi
            docker compose -f "$compose_file" config --quiet
            docker pull "$image"
            expected_image="$(docker image inspect --format '{{.Id}}' "$image")"
            if [[ -z "$expected_image" ]]; then
              printf 'Cannot identify the pulled latest image\n' >&2
              exit 1
            fi

            # Preserve the existing environment and configuration, and recreate only this service.
            docker compose -f "$compose_file" up -d --no-deps --force-recreate go-ramjet
            container="$(docker compose -f "$compose_file" ps --quiet go-ramjet)"
            if [[ -z "$container" || "$container" == *$'\n'* ]]; then
              printf 'Expected exactly one deployed go-ramjet container\n' >&2
              exit 1
            fi
            running="$(docker inspect --format '{{.State.Running}}' "$container")"
            if [[ "$running" != true ]]; then
              printf 'The deployed go-ramjet container is not running\n' >&2
              exit 1
            fi
            actual_image="$(docker inspect --format '{{.Image}}' "$container")"
            if [[ "$actual_image" != "$expected_image" ]]; then
              printf 'The running go-ramjet image does not match the pulled latest image\n' >&2
              exit 1
            fi

            container_ips="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{if .IPAddress}}{{.IPAddress}}{{"\n"}}{{end}}{{end}}' "$container")"
            container_ip="${container_ips%%$'\n'*}"
            if [[ ! "$container_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'Cannot identify the go-ramjet container IPv4 address\n' >&2
              exit 1
            fi
            health_status="$(curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused \
              --connect-timeout 5 --max-time 15 --output /dev/null --write-out '%{http_code}' \
              "http://${container_ip}:24456/gptchat/version")"
            if [[ "$health_status" != 200 ]]; then
              printf 'The go-ramjet version health probe did not return HTTP 200\n' >&2
              exit 1
            fi
            printf 'go-ramjet is running with the pulled latest image; version health probe returned HTTP 200\n'
            RAMJET_DEPLOY
