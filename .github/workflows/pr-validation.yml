name: pull-request-validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit to compare for formatting
        required: true
        type: string
      run_paired:
        description: Run issue 94 paired-service qualification
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pull-request-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  SPEECHSDK_ROOT: /opt/azure/speech
  SPEECHSDK_VERSION: 1.52.0

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect browser-relevant changes
        id: browser_scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B ci/fast_ci_scope.py "$BASE_SHA" "$HEAD_SHA"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libasound2t64 libssl-dev poppler-utils dbus-daemon wget python3-yaml
          wget -O /tmp/SpeechSDK-Linux.tar.gz \
            "https://csspeechstorage.blob.core.windows.net/drop/${SPEECHSDK_VERSION}/SpeechSDK-Linux-${SPEECHSDK_VERSION}.tar.gz"
          sudo mkdir -p "${SPEECHSDK_ROOT}"
          sudo tar --strip-components=1 -xzf /tmp/SpeechSDK-Linux.tar.gz -C "${SPEECHSDK_ROOT}"
          rm -f /tmp/SpeechSDK-Linux.tar.gz
          {
            echo "CGO_CFLAGS=-I${SPEECHSDK_ROOT}/include/c_api"
            echo "CGO_LDFLAGS=-L${SPEECHSDK_ROOT}/lib/x64 -lMicrosoft.CognitiveServices.Speech.core"
            echo "LD_LIBRARY_PATH=${SPEECHSDK_ROOT}/lib/x64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          } >> "${GITHUB_ENV}"

      - name: Verify changed Go formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          mapfile -t go_files < <(
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}" "${HEAD_SHA}" \
              | grep -E '\.go$' \
              || true
          )
          if (( ${#go_files[@]} == 0 )); then
            echo "No changed Go files require formatting validation"
            exit 0
          fi

          gofmt_output="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${gofmt_output}" ]]; then
            echo "gofmt is required for:"
            echo "${gofmt_output}"
            exit 1
          fi

          goimports_output="$(goimports -local github.com/Laisky/go-ramjet -l "${go_files[@]}")"
          if [[ -n "${goimports_output}" ]]; then
            echo "goimports is required for:"
            echo "${goimports_output}"
            exit 1
          fi

      - name: Generate Go 1.27 module metadata
        id: tidy
        shell: bash
        run: |
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy

          if cmp -s /tmp/go.mod.before go.mod && cmp -s /tmp/go.sum.before go.sum; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "go.mod and go.sum are tidy"
            exit 0
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "Go 1.27 changed module metadata:"
          diff -u /tmp/go.mod.before go.mod || true
          diff -u /tmp/go.sum.before go.sum || true

      - name: Upload tidied module files
        if: steps.tidy.outputs.changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: go-1.27-tidied-modules
          path: |
            go.mod
            go.sum
          if-no-files-found: error

      - name: Verify module files are tidy
        if: steps.tidy.outputs.changed == 'true'
        shell: bash
        run: |
          echo "go.mod or go.sum is not tidy for Go 1.27"
          exit 1

      - name: Run release deployment contract tests
        run: /usr/bin/python3 -B ci/test_release_deployment.py

      - name: Run CV diagnostic matrix driver contracts
        run: |
          python3 -B ci/test_probe_cv_print.py
          python3 -B ci/test_browser_cache_graph.py
          python3 -B ci/test_fast_ci.py

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Run current browser smoke
        if: github.event_name == 'pull_request' && steps.browser_scope.outputs.browser == 'true'
        env:
          CRAWLER_HTTP_PROXY: ''
          CV_PRINT_PROBE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -B ci/probe_cv_smoke.py

      - name: Prepare immutable browser dependency cache profiles
        if: github.event_name == 'workflow_dispatch'
        id: cv_print_prepare
        timeout-minutes: 10
        env:
          CV_PRINT_PROBE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B ci/probe_cv_print.py --prepare-cache

      - name: Run browser dependency integration tests
        if: github.event_name == 'workflow_dispatch'
        id: cv_print_probe
        env:
          CRAWLER_HTTP_PROXY: ''
          CV_PRINT_PROBE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          command -v google-chrome || command -v chromium
          command -v pdftotext
          python3 ci/probe_cv_print.py

      - name: Upload bounded CV print diagnostic evidence
        if: always() && (steps.cv_print_prepare.outcome != 'skipped' || steps.cv_print_probe.outcome != 'skipped')
        uses: actions/upload-artifact@v5
        with:
          name: cv-print-diagnostic-evidence
          path: |
            /tmp/task02-cv-print-cache-preparation.json
            /tmp/task02-cv-print-probe-report.json
          if-no-files-found: error

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        shell: bash
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run -c .golangci.yml

      - name: Run govulncheck
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      # Qualify cross-repository behavior only for PR #95; normal CI stays fast.
      - name: Checkout issue 94 companion caller
        if: github.event.pull_request.number == 95 || (github.event_name == 'workflow_dispatch' && inputs.run_paired)
        uses: actions/checkout@v6
        with:
          repository: Laisky/laisky-blog-graphql
          ref: fd61b61a40178be8884608bfc132f5670260d20f
          path: paired-caller
          persist-credentials: false

      - name: Run issue 94 paired service behavior (race)
        if: github.event.pull_request.number == 95 || (github.event_name == 'workflow_dispatch' && inputs.run_paired)
        timeout-minutes: 20
        shell: bash
        env:
          EXPECTED_WORKER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_CALLER_HEAD: fd61b61a40178be8884608bfc132f5670260d20f
        run: |
          set -euo pipefail
          # Assert the actual PR head rather than the synthetic merge commit.
          git checkout --detach "$EXPECTED_WORKER_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORKER_HEAD"
          test "$(git -C paired-caller rev-parse HEAD)" = "$EXPECTED_CALLER_HEAD"
          echo "Worker head: $(git rev-parse HEAD)"
          echo "Caller head: $(git -C paired-caller rev-parse HEAD)"
          go version
          if ! command -v redis-server >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends redis-server
          fi
          redis-server --version
          go work init . ./paired-caller
          go test -mod=readonly -race -c \
            -o "$RUNNER_TEMP/issue94-ramjet-service-race.test" \
            ./internal/tasks/gptchat/tasks
          (
            cd paired-caller
            CRAWLER_SERVICE_TEST_WORKER_BINARY="$RUNNER_TEMP/issue94-ramjet-service-race.test" \
              go test -mod=readonly -race -count=1 -timeout=3m \
                ./internal/mcp -run '^TestMCPWebFetchServicePath$' -v \
              | tee "$RUNNER_TEMP/issue94-paired.log"
          )
          python3 - <<'PY'
          import os
          import pathlib
          import re
          report = pathlib.Path(os.environ["RUNNER_TEMP"], "issue94-paired.log").read_text()
          passed = re.findall(r"^\s+--- PASS: TestMCPWebFetchServicePath/", report, re.M)
          skipped = re.findall(r"^\s+--- SKIP: TestMCPWebFetchServicePath/", report, re.M)
          if len(passed) != 15 or skipped:
              raise SystemExit(f"expected 15 passed paired subcases, got {len(passed)}; skipped {len(skipped)}")
          print(f"Paired service acceptance: {len(passed)}/15 passed; zero skipped")
          PY

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          pnpm -C web install --frozen-lockfile

      - name: Check changed frontend formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t frontend_files < <(
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}" "${HEAD_SHA}" -- web \
              | grep -E '\.(cjs|css|html|js|json|jsx|md|mjs|scss|ts|tsx|yaml|yml)$' \
              || true
          )
          if (( ${#frontend_files[@]} == 0 )); then
            echo "No changed frontend files require Prettier validation"
            exit 0
          fi
          for index in "${!frontend_files[@]}"; do
            frontend_files[${index}]="${frontend_files[${index}]#web/}"
          done
          pnpm -C web exec prettier --check "${frontend_files[@]}"

      - name: Lint all frontend files
        run: pnpm -C web lint

      - name: Run tests
        run: pnpm -C web test

      - name: Build frontend
        run: pnpm -C web build

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    name: SPA metadata benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify package behavior
        run: go test ./library/web -count=1

      - name: Measure legacy and optimized implementations
        shell: bash
        run: |
          GOMAXPROCS=1 go test ./library/web \
            -run '^$' \
            -bench '^BenchmarkApplySiteMetadataToHTML$' \
            -benchmem \
            -benchtime=1s \
            -count=10 | tee /tmp/spa-metadata-benchmark.txt

          python3 <<'PY'
          import os
          import re
          import statistics
          from pathlib import Path

          pattern = re.compile(
              r"^BenchmarkApplySiteMetadataToHTML/(legacy|optimized)(?:-\d+)?\s+"
              r"\d+\s+([0-9.]+)\s+ns/op\s+.*?\s+(\d+)\s+B/op\s+(\d+)\s+allocs/op$"
          )
          samples = {
              "legacy": {"ns": [], "bytes": [], "allocs": []},
              "optimized": {"ns": [], "bytes": [], "allocs": []},
          }
          for line in Path("/tmp/spa-metadata-benchmark.txt").read_text().splitlines():
              match = pattern.match(line.strip())
              if not match:
                  continue
              variant, ns_op, bytes_op, allocs_op = match.groups()
              samples[variant]["ns"].append(float(ns_op))
              samples[variant]["bytes"].append(float(bytes_op))
              samples[variant]["allocs"].append(float(allocs_op))

          for variant in samples:
              if len(samples[variant]["ns"]) != 10:
                  raise SystemExit(
                      f"expected 10 {variant} samples, got {len(samples[variant]['ns'])}"
                  )

          legacy = {key: statistics.median(values) for key, values in samples["legacy"].items()}
          optimized = {
              key: statistics.median(values) for key, values in samples["optimized"].items()
          }
          runtime_reduction = (legacy["ns"] - optimized["ns"]) / legacy["ns"] * 100
          bytes_reduction = (legacy["bytes"] - optimized["bytes"]) / legacy["bytes"] * 100
          allocs_reduction = (legacy["allocs"] - optimized["allocs"]) / legacy["allocs"] * 100
          throughput_gain = (legacy["ns"] / optimized["ns"] - 1) * 100

          summary = f"""### SPA metadata benchmark

          Median of 10 runs with `GOMAXPROCS=1`, Go from `go.mod`, and identical fixtures:

          | Metric | Legacy | Optimized | Improvement |
          |---|---:|---:|---:|
          | Runtime | {legacy['ns']:.0f} ns/op | {optimized['ns']:.0f} ns/op | {runtime_reduction:.2f}% lower |
          | Heap | {legacy['bytes']:.0f} B/op | {optimized['bytes']:.0f} B/op | {bytes_reduction:.2f}% lower |
          | Allocations | {legacy['allocs']:.0f} allocs/op | {optimized['allocs']:.0f} allocs/op | {allocs_reduction:.2f}% lower |
          | Throughput | 1.00x | {legacy['ns'] / optimized['ns']:.2f}x | {throughput_gain:.2f}% higher |
          """
          print(summary)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary_file:
              summary_file.write(summary)

          if runtime_reduction < 5:
              raise SystemExit(f"runtime improvement is only {runtime_reduction:.2f}%")
          if bytes_reduction < 10:
              raise SystemExit(f"heap improvement is only {bytes_reduction:.2f}%")
          if allocs_reduction < 50:
              raise SystemExit(f"allocation improvement is only {allocs_reduction:.2f}%")
          PY

  image:
    if: github.event_name == 'workflow_dispatch'
    name: Production image build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=pr-production-image
          cache-to: type=gha,mode=max,scope=pr-production-image
