name: Bolt verification

on:
  pull_request:
    branches: [master]
    paths:
      - AGENTS.md
      - Dockerfile
      - go.mod
      - go.sum
      - docs/manual/dev.md
      - internal/tasks/gptchat/agentx/prompt/**
      - .github/workflows/bolt-verify.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: bolt-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  GO_VERSION: 1.27.0
  SPEECHSDK_ROOT: /opt/azure/speech
  CGO_CFLAGS: -I/opt/azure/speech/include/c_api
  CGO_LDFLAGS: -L/opt/azure/speech/lib/x64 -lMicrosoft.CognitiveServices.Speech.core
  LD_LIBRARY_PATH: /opt/azure/speech/lib/x64

jobs:
  performance-and-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      benchmark_summary: ${{ steps.benchmark.outputs.status_description }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git jq libssl-dev libasound2t64 wget
          sudo mkdir -p "$SPEECHSDK_ROOT"
          wget -q -O /tmp/SpeechSDK-Linux.tar.gz \
            https://csspeechstorage.blob.core.windows.net/drop/1.50.0/SpeechSDK-Linux-1.50.0.tar.gz
          sudo tar --strip 1 -xzf /tmp/SpeechSDK-Linux.tar.gz -C "$SPEECHSDK_ROOT"

      - name: Record benchmark environment
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go version
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket'

      - name: Benchmark base and optimized revisions
        id: benchmark
        shell: bash
        run: |
          set -euo pipefail
          bench_file=internal/tasks/gptchat/agentx/prompt/react_render_benchmark_test.go
          cp "$bench_file" /tmp/react_render_benchmark_test.go

          git checkout --detach "$BASE_SHA"
          cp /tmp/react_render_benchmark_test.go "$bench_file"
          go test ./internal/tasks/gptchat/agentx/prompt \
            -run '^TestRender_ByteForByteCompatibility$' -count=1
          go test ./internal/tasks/gptchat/agentx/prompt \
            -run '^$' -bench '^BenchmarkReactRendererRender$' \
            -benchmem -cpu=1 -benchtime=1s -count=10 | tee /tmp/baseline.txt

          rm "$bench_file"
          git checkout --detach "$HEAD_SHA"
          go test ./internal/tasks/gptchat/agentx/prompt \
            -run '^TestRender_ByteForByteCompatibility$' -count=1
          go test ./internal/tasks/gptchat/agentx/prompt \
            -run '^$' -bench '^BenchmarkReactRendererRender$' \
            -benchmem -cpu=1 -benchtime=1s -count=10 | tee /tmp/optimized.txt

          python3 - <<'PY'
          import os
          import pathlib
          import re
          import statistics

          pattern = re.compile(
              r'^BenchmarkReactRendererRender(?:-\d+)?\s+\d+\s+'
              r'([\d.]+) ns/op.*?(\d+) B/op\s+(\d+) allocs/op$',
              re.MULTILINE,
          )

          def parse(path):
              rows = pattern.findall(pathlib.Path(path).read_text())
              if len(rows) != 10:
                  raise SystemExit(f'expected 10 rows in {path}, got {len(rows)}')
              ns = [float(row[0]) for row in rows]
              heap = [int(row[1]) for row in rows]
              allocs = [int(row[2]) for row in rows]
              return statistics.median(ns), statistics.median(heap), statistics.median(allocs)

          baseline = parse('/tmp/baseline.txt')
          optimized = parse('/tmp/optimized.txt')
          if any(after >= before for before, after in zip(baseline, optimized)):
              raise SystemExit(f'not beneficial: baseline={baseline}, optimized={optimized}')

          reductions = tuple(
              (before - after) / before * 100
              for before, after in zip(baseline, optimized)
          )
          speedup = baseline[0] / optimized[0]
          summary = (
              '## ReAct prompt benchmark (Go 1.27.0)\n\n'
              '| Metric | Baseline | Optimized | Improvement |\n'
              '|---|---:|---:|---:|\n'
              f'| Time | {baseline[0]:.2f} ns/op | {optimized[0]:.2f} ns/op | '
              f'{reductions[0]:.2f}% lower ({speedup:.2f}x faster) |\n'
              f'| Heap | {baseline[1]:.0f} B/op | {optimized[1]:.0f} B/op | '
              f'{reductions[1]:.2f}% lower |\n'
              f'| Allocations | {baseline[2]:.0f} allocs/op | {optimized[2]:.0f} allocs/op | '
              f'{reductions[2]:.2f}% lower |\n'
          )
          print(summary)
          pathlib.Path('/tmp/benchmark-summary.md').write_text(summary)
          description = (
              f'{baseline[0]:.0f}->{optimized[0]:.0f} ns/op; '
              f'{baseline[1]:.0f}->{optimized[1]:.0f} B/op; '
              f'{baseline[2]:.0f}->{optimized[2]:.0f} allocs/op'
          )
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'status_description={description}\n')
          PY
          cat /tmp/benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify formatting and behavior
        run: |
          test -z "$(gofmt -d \
            internal/tasks/gptchat/agentx/prompt/react.go \
            internal/tasks/gptchat/agentx/prompt/react_render_benchmark_test.go)"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          go test ./internal/tasks/gptchat/agentx/prompt -count=1

  repository-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git jq libssl-dev libasound2t64 wget
          sudo mkdir -p "$SPEECHSDK_ROOT"
          wget -q -O /tmp/SpeechSDK-Linux.tar.gz \
            https://csspeechstorage.blob.core.windows.net/drop/1.50.0/SpeechSDK-Linux-1.50.0.tar.gz
          sudo tar --strip 1 -xzf /tmp/SpeechSDK-Linux.tar.gz -C "$SPEECHSDK_ROOT"
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0
          corepack enable
          pnpm -C web install --frozen-lockfile

      - name: Validate Go 1.27 declarations and changed files
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          grep -Fx 'go 1.27.0' go.mod
          grep -F 'FROM golang:1.27.0-bookworm AS gobuild' Dockerfile
          grep -F 'Code targets **Go 1.27**' AGENTS.md
          grep -F -- '- Go 1.27+' docs/manual/dev.md
          test -z "$(goimports -d \
            internal/tasks/gptchat/agentx/prompt/react.go \
            internal/tasks/gptchat/agentx/prompt/react_render_benchmark_test.go)"
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- web

      - name: Run Go vet
        run: go vet ./...

      - name: Compare full Go test-suite outcomes
        shell: bash
        run: |
          set -euo pipefail
          run_suite() {
            local ref=$1 label=$2
            git reset --hard
            git clean -fd
            git checkout --detach "$ref"
            go clean -testcache
            set +e
            go test -json ./... -count=1 >"/tmp/${label}.json" 2>&1
            echo "$?" >"/tmp/${label}.status"
            set -e
            jq -r 'select(.Action == "fail" and .Package != null and .Test == null) | .Package' \
              "/tmp/${label}.json" | sort -u >"/tmp/${label}.packages"
          }
          run_suite "$BASE_SHA" baseline
          run_suite "$HEAD_SHA" optimized
          test "$(cat /tmp/baseline.status)" = "$(cat /tmp/optimized.status)"
          diff -u /tmp/baseline.packages /tmp/optimized.packages
          ! grep -Fx 'github.com/Laisky/go-ramjet/internal/tasks/gptchat/agentx/prompt' \
            /tmp/optimized.packages
          {
            echo '## Full Go suite differential'
            echo
            echo "- Exit status: \`$(cat /tmp/optimized.status)\` on both revisions"
            echo "- Existing failed packages: \`$(wc -l </tmp/optimized.packages)\` on both revisions"
            echo '- Changed prompt package passed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare project make lint outcomes
        shell: bash
        run: |
          set -euo pipefail
          run_make_lint() {
            local ref=$1 label=$2
            git reset --hard
            git clean -fd
            git checkout --detach "$ref"
            set +e
            make lint >"/tmp/${label}-make-lint.log" 2>&1
            echo "$?" >"/tmp/${label}-make-lint.status"
            set -e
            sed -E $'s/\x1B\[[0-9;]*[[:alpha:]]//g' "/tmp/${label}-make-lint.log" \
              | grep -Ei '(\.go:[0-9]+:[0-9]+:|error|fatal|panic|failed|not found|unsupported|invalid|make: \*\*\*)' \
              | sed -E 's/1\.26\.4|1\.27\.0/<go-version>/g' \
              | sort -u >"/tmp/${label}-make-lint.signatures" || true
            git reset --hard
            git clean -fd
          }
          run_make_lint "$BASE_SHA" baseline
          run_make_lint "$HEAD_SHA" optimized
          test "$(cat /tmp/baseline-make-lint.status)" = "$(cat /tmp/optimized-make-lint.status)"
          diff -u /tmp/baseline-make-lint.signatures /tmp/optimized-make-lint.signatures
          if [[ $(cat /tmp/optimized-make-lint.status) != 0 ]]; then
            test -s /tmp/optimized-make-lint.signatures
          fi

      - name: Compare direct golangci-lint diagnostics
        shell: bash
        run: |
          set -euo pipefail
          run_golangci() {
            local ref=$1 label=$2
            git reset --hard
            git clean -fd
            git checkout --detach "$ref"
            set +e
            golangci-lint run -c .golangci.yml >"/tmp/${label}-golangci.log" 2>&1
            echo "$?" >"/tmp/${label}-golangci.status"
            set -e
            sed -E $'s/\x1B\[[0-9;]*[[:alpha:]]//g' "/tmp/${label}-golangci.log" \
              | grep -Ei '(\.go:[0-9]+:[0-9]+:|error|fatal|panic|failed|unsupported|invalid)' \
              | sed -E 's/1\.26\.4|1\.27\.0/<go-version>/g' \
              | sort -u >"/tmp/${label}-golangci.signatures" || true
          }
          run_golangci "$BASE_SHA" baseline
          run_golangci "$HEAD_SHA" optimized
          test "$(cat /tmp/baseline-golangci.status)" = "$(cat /tmp/optimized-golangci.status)"
          diff -u /tmp/baseline-golangci.signatures /tmp/optimized-golangci.signatures
          if [[ $(cat /tmp/optimized-golangci.status) != 0 ]]; then
            test -s /tmp/optimized-golangci.signatures
          fi

      - name: Compare vulnerability findings
        shell: bash
        run: |
          set -euo pipefail
          run_vuln() {
            local ref=$1 label=$2
            git reset --hard
            git clean -fd
            git checkout --detach "$ref"
            set +e
            govulncheck ./... >"/tmp/${label}-vuln.log" 2>&1
            echo "$?" >"/tmp/${label}-vuln.status"
            set -e
            grep -Eo 'GO-[0-9]{4}-[0-9]+' "/tmp/${label}-vuln.log" \
              | sort -u >"/tmp/${label}-vuln.ids" || true
          }
          run_vuln "$BASE_SHA" baseline
          run_vuln "$HEAD_SHA" optimized
          test "$(cat /tmp/baseline-vuln.status)" = "$(cat /tmp/optimized-vuln.status)"
          diff -u /tmp/baseline-vuln.ids /tmp/optimized-vuln.ids

      - name: Compare frontend test outcomes
        shell: bash
        run: |
          set -euo pipefail
          run_frontend() {
            local ref=$1 label=$2
            git reset --hard
            git checkout --detach "$ref"
            set +e
            pnpm -C web test >"/tmp/${label}-frontend.log" 2>&1
            echo "$?" >"/tmp/${label}-frontend.status"
            set -e
            sed -E $'s/\x1B\[[0-9;]*[[:alpha:]]//g' "/tmp/${label}-frontend.log" \
              | grep -E '^[[:space:]]*FAIL ' \
              | sed -E 's/[[:space:]]+\[[[:space:]]*[0-9.]+[[:space:]]*ms[[:space:]]*\]$//' \
              | sort -u >"/tmp/${label}-frontend.failures" || true
          }
          run_frontend "$BASE_SHA" baseline
          run_frontend "$HEAD_SHA" optimized
          test "$(cat /tmp/baseline-frontend.status)" = "$(cat /tmp/optimized-frontend.status)"
          diff -u /tmp/baseline-frontend.failures /tmp/optimized-frontend.failures
          if [[ $(cat /tmp/optimized-frontend.status) != 0 ]]; then
            test -s /tmp/optimized-frontend.failures
          fi

      - name: Compare frontend ESLint and Prettier outcomes
        shell: bash
        run: |
          set -euo pipefail
          run_frontend_static() {
            local ref=$1 label=$2
            git reset --hard
            git checkout --detach "$ref"
            set +e
            pnpm -C web exec eslint . --format json >"/tmp/${label}-eslint.json" 2>/tmp/${label}-eslint.stderr
            echo "$?" >"/tmp/${label}-eslint.status"
            pnpm -C web exec prettier --check . >"/tmp/${label}-prettier.log" 2>&1
            echo "$?" >"/tmp/${label}-prettier.status"
            set -e
            jq -S '[.[] | {filePath: (.filePath | split("/web/")[-1]), messages: [.messages[] | {line, column, endLine, endColumn, severity, ruleId, message}]}]' \
              "/tmp/${label}-eslint.json" >"/tmp/${label}-eslint.canonical.json"
          }
          run_frontend_static "$BASE_SHA" baseline
          run_frontend_static "$HEAD_SHA" optimized
          test "$(cat /tmp/baseline-eslint.status)" = "$(cat /tmp/optimized-eslint.status)"
          test "$(cat /tmp/baseline-prettier.status)" = "$(cat /tmp/optimized-prettier.status)"
          diff -u /tmp/baseline-eslint.canonical.json /tmp/optimized-eslint.canonical.json

      - name: Build frontend and Go 1.27 Docker image
        shell: bash
        run: |
          git reset --hard
          git checkout --detach "$HEAD_SHA"
          pnpm -C web build
          docker build --tag go-ramjet:bolt-go127 .

  report:
    if: always()
    needs: [performance-and-correctness, repository-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Publish aggregate verification status
        env:
          GH_TOKEN: ${{ github.token }}
          PERF_RESULT: ${{ needs.performance-and-correctness.result }}
          VERIFY_RESULT: ${{ needs.repository-verification.result }}
          BENCHMARK_SUMMARY: ${{ needs.performance-and-correctness.outputs.benchmark_summary }}
        shell: bash
        run: |
          state=success
          if [[ "$PERF_RESULT" != success || "$VERIFY_RESULT" != success ]]; then
            state=failure
          fi
          if [[ "$state" == success && -n "$BENCHMARK_SUMMARY" ]]; then
            description="$BENCHMARK_SUMMARY; Go 1.27 verified"
          else
            description="performance=$PERF_RESULT verification=$VERIFY_RESULT"
          fi
          description=${description:0:140}
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context=bolt/verification \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          [[ "$state" == success ]]
