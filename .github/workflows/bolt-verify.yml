name: Bolt verification

on:
  pull_request:
    branches: [master]
    paths:
      - .dockerignore
      - AGENTS.md
      - Dockerfile
      - go.mod
      - go.sum
      - docs/manual/dev.md
      - internal/tasks/gptchat/agentx/prompt/**
      - .github/workflows/bolt-verify.yml
      - .github/scripts/renderer-change/**

permissions:
  contents: read
  statuses: write

concurrency:
  group: bolt-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  GO_VERSION: 1.27.1
  SPEECHSDK_VERSION: 1.52.0
  RUN_GPT_HTTP_IT: ''
  RUN_GPT_S3_IT: ''
  DISABLE_LLM_CONSERVATION_AUDIT: 'true'
  SPEECHSDK_ROOT: /opt/azure/speech
  CGO_CFLAGS: -I/opt/azure/speech/include/c_api
  CGO_LDFLAGS: -L/opt/azure/speech/lib/x64 -lMicrosoft.CognitiveServices.Speech.core
  LD_LIBRARY_PATH: /opt/azure/speech/lib/x64

jobs:
  performance-and-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      benchmark_summary: ${{ steps.benchmark.outputs.status_description }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Detect executable renderer changes
        id: benchmark_changes
        env:
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          go test ./.github/scripts/renderer-change -count=1
          go run ./.github/scripts/renderer-change \
            -base "$BASE_SHA" -head "$HEAD_SHA" \
            -path internal/tasks/gptchat/agentx/prompt/react.go >> "$GITHUB_OUTPUT"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git jq libssl-dev libasound2t64 wget
          sudo mkdir -p "$SPEECHSDK_ROOT"
          wget -q -O /tmp/SpeechSDK-Linux.tar.gz \
            "https://csspeechstorage.blob.core.windows.net/drop/${SPEECHSDK_VERSION}/SpeechSDK-Linux-${SPEECHSDK_VERSION}.tar.gz"
          sudo tar --strip 1 -xzf /tmp/SpeechSDK-Linux.tar.gz -C "$SPEECHSDK_ROOT"

      - name: Record benchmark environment
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go version
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket'

      - name: Benchmark base and optimized renderer implementations
        if: steps.benchmark_changes.outputs.changed == 'true'
        id: benchmark
        shell: bash
        run: |
          set -euo pipefail
          render_file=internal/tasks/gptchat/agentx/prompt/react.go
          cp "$render_file" /tmp/react-head.go
          trap 'cp /tmp/react-head.go "$render_file"' EXIT

          # Keep the toolchain, dependencies, benchmark, and test identical. Only swap
          # the production renderer source so unrelated base metadata cannot skew or
          # prevent the before/after measurement.
          git show "$BASE_SHA:$render_file" > "$render_file"
          go test ./internal/tasks/gptchat/agentx/prompt \
            -run '^TestRender_ByteForByteCompatibility$' -count=1
          go test ./internal/tasks/gptchat/agentx/prompt \
            -run '^$' -bench '^BenchmarkReactRendererRender$' \
            -benchmem -cpu=1 -benchtime=1s -count=10 | tee /tmp/baseline.txt

          cp /tmp/react-head.go "$render_file"
          trap - EXIT
          go test ./internal/tasks/gptchat/agentx/prompt \
            -run '^TestRender_ByteForByteCompatibility$' -count=1
          go test ./internal/tasks/gptchat/agentx/prompt \
            -run '^$' -bench '^BenchmarkReactRendererRender$' \
            -benchmem -cpu=1 -benchtime=1s -count=10 | tee /tmp/optimized.txt
          git diff --exit-code "$HEAD_SHA" -- "$render_file"

          python3 - <<'PY'
          import os
          import pathlib
          import re
          import statistics

          pattern = re.compile(
              r'^BenchmarkReactRendererRender(?:-\d+)?\s+\d+\s+'
              r'([\d.]+) ns/op.*?(\d+) B/op\s+(\d+) allocs/op$',
              re.MULTILINE,
          )

          def parse(path):
              rows = pattern.findall(pathlib.Path(path).read_text())
              if len(rows) != 10:
                  raise SystemExit(f'expected 10 rows in {path}, got {len(rows)}')
              ns = [float(row[0]) for row in rows]
              heap = [int(row[1]) for row in rows]
              allocs = [int(row[2]) for row in rows]
              return statistics.median(ns), statistics.median(heap), statistics.median(allocs)

          baseline = parse('/tmp/baseline.txt')
          optimized = parse('/tmp/optimized.txt')
          if any(after >= before for before, after in zip(baseline, optimized)):
              raise SystemExit(f'not beneficial: baseline={baseline}, optimized={optimized}')

          reductions = tuple(
              (before - after) / before * 100
              for before, after in zip(baseline, optimized)
          )
          speedup = baseline[0] / optimized[0]
          summary = (
              f"## ReAct prompt benchmark (Go {os.environ['GO_VERSION']})\n\n"
              '| Metric | Baseline | Optimized | Improvement |\n'
              '|---|---:|---:|---:|\n'
              f'| Time | {baseline[0]:.2f} ns/op | {optimized[0]:.2f} ns/op | '
              f'{reductions[0]:.2f}% lower ({speedup:.2f}x faster) |\n'
              f'| Heap | {baseline[1]:.0f} B/op | {optimized[1]:.0f} B/op | '
              f'{reductions[1]:.2f}% lower |\n'
              f'| Allocations | {baseline[2]:.0f} allocs/op | {optimized[2]:.0f} allocs/op | '
              f'{reductions[2]:.2f}% lower |\n'
          )
          print(summary)
          pathlib.Path('/tmp/benchmark-summary.md').write_text(summary)
          description = (
              f'{baseline[0]:.0f}->{optimized[0]:.0f} ns/op; '
              f'{baseline[1]:.0f}->{optimized[1]:.0f} B/op; '
              f'{baseline[2]:.0f}->{optimized[2]:.0f} allocs/op'
          )
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'status_description={description}\n')
          PY
          cat /tmp/benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify formatting and behavior
        run: |
          test -z "$(gofmt -d \
            internal/tasks/gptchat/agentx/prompt/react.go \
            internal/tasks/gptchat/agentx/prompt/react_render_benchmark_test.go)"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          go test ./internal/tasks/gptchat/agentx/prompt -count=1

  repository-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'

      - name: Install dependencies and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git jq libssl-dev libasound2t64 wget
          sudo mkdir -p "$SPEECHSDK_ROOT"
          wget -q -O /tmp/SpeechSDK-Linux.tar.gz \
            "https://csspeechstorage.blob.core.windows.net/drop/${SPEECHSDK_VERSION}/SpeechSDK-Linux-${SPEECHSDK_VERSION}.tar.gz"
          sudo tar --strip 1 -xzf /tmp/SpeechSDK-Linux.tar.gz -C "$SPEECHSDK_ROOT"
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          corepack enable
          pnpm -C web install --frozen-lockfile

      - name: Validate Go 1.27 declarations and changed files
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          grep -Fx "go ${GO_VERSION}" go.mod
          grep -F "FROM golang:${GO_VERSION}-bookworm AS gobuild" Dockerfile
          grep -F 'Code targets **Go 1.27**' AGENTS.md
          grep -F -- '- Go 1.27+' docs/manual/dev.md
          test -z "$(goimports -d \
            internal/tasks/gptchat/agentx/prompt/react.go \
            internal/tasks/gptchat/agentx/prompt/react_render_benchmark_test.go)"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Run Go vet
        run: go vet ./... ./.github/scripts/renderer-change

      - name: Run full head Go test suite
        shell: bash
        run: |
          set -euo pipefail
          go test -json ./... -count=1 -timeout=20m | tee /tmp/head-tests.json

      - name: Run project lint on head
        shell: bash
        run: |
          set -euo pipefail
          make lint
          git diff --exit-code HEAD

      - name: Run direct Go lint on head
        run: |
          golangci-lint run -c .golangci.yml
          golangci-lint run -c .golangci.yml ./.github/scripts/renderer-change

      - name: Check head vulnerabilities
        run: govulncheck ./...

      - name: Run full head frontend test suite
        run: pnpm -C web test

      - name: Check changed frontend static files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" -- web \
            > /tmp/changed-frontend-files
          prettier_files=()
          eslint_files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.cjs|*.css|*.html|*.js|*.json|*.jsx|*.md|*.mjs|*.scss|*.ts|*.tsx|*.yaml|*.yml)
                prettier_files+=("${file#web/}")
                ;;
            esac
            case "$file" in
              *.cjs|*.js|*.jsx|*.mjs|*.ts|*.tsx)
                eslint_files+=("${file#web/}")
                ;;
            esac
          done < /tmp/changed-frontend-files
          if (( ${#prettier_files[@]} > 0 )); then
            pnpm -C web exec prettier --check "${prettier_files[@]}"
          fi
          if (( ${#eslint_files[@]} > 0 )); then
            pnpm -C web exec eslint "${eslint_files[@]}"
          fi

      - name: Build frontend and Go 1.27 Docker image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          pnpm -C web build
          docker build --tag go-ramjet:bolt-go127 .

          container_id=$(docker create go-ramjet:bolt-go127)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/go-ramjet" /tmp/go-ramjet
          docker rm "$container_id"
          trap - EXIT

          go version -m /tmp/go-ramjet | tee /tmp/go-ramjet-build-info.txt
          grep -Fx $'\tbuild\tvcs.revision='"$HEAD_SHA" /tmp/go-ramjet-build-info.txt
          grep -E $'^\tbuild\tvcs.time=' /tmp/go-ramjet-build-info.txt

  report:
    if: always()
    needs: [performance-and-correctness, repository-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Publish aggregate verification status
        env:
          GH_TOKEN: ${{ github.token }}
          PERF_RESULT: ${{ needs.performance-and-correctness.result }}
          VERIFY_RESULT: ${{ needs.repository-verification.result }}
          BENCHMARK_SUMMARY: ${{ needs.performance-and-correctness.outputs.benchmark_summary }}
        shell: bash
        run: |
          state=success
          if [[ "$PERF_RESULT" != success || "$VERIFY_RESULT" != success ]]; then
            state=failure
          fi
          if [[ "$state" == success && -n "$BENCHMARK_SUMMARY" ]]; then
            description="$BENCHMARK_SUMMARY; Go 1.27 verified"
          else
            description="performance=$PERF_RESULT verification=$VERIFY_RESULT"
          fi
          description=${description:0:140}
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context=bolt/verification \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          [[ "$state" == success ]]
