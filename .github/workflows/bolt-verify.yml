name: Bolt verification

on:
  pull_request:
    branches:
      - master
    paths:
      - AGENTS.md
      - Dockerfile
      - go.mod
      - go.sum
      - docs/manual/dev.md
      - internal/tasks/gptchat/agentx/prompt/**
      - .github/workflows/bolt-verify.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: bolt-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  GO_VERSION: 1.27.0
  SPEECHSDK_ROOT: /opt/azure/speech
  CGO_CFLAGS: -I/opt/azure/speech/include/c_api
  CGO_LDFLAGS: -L/opt/azure/speech/lib/x64 -lMicrosoft.CognitiveServices.Speech.core
  LD_LIBRARY_PATH: /opt/azure/speech/lib/x64

jobs:
  performance-and-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      benchmark_summary: ${{ steps.benchmark.outputs.status_description }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libssl-dev libasound2t64 wget
          sudo mkdir -p "$SPEECHSDK_ROOT"
          wget -q -O /tmp/SpeechSDK-Linux.tar.gz \
            https://csspeechstorage.blob.core.windows.net/drop/1.50.0/SpeechSDK-Linux-1.50.0.tar.gz
          sudo tar --strip 1 -xzf /tmp/SpeechSDK-Linux.tar.gz -C "$SPEECHSDK_ROOT"

      - name: Record benchmark environment
        shell: bash
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go version
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket'

      - name: Benchmark baseline and optimized implementations
        id: benchmark
        shell: bash
        run: |
          set -euo pipefail
          bench_file=internal/tasks/gptchat/agentx/prompt/react_render_benchmark_test.go
          cp "$bench_file" /tmp/react_render_benchmark_test.go

          git checkout --detach "$BASE_SHA"
          cp /tmp/react_render_benchmark_test.go "$bench_file"
          go test ./internal/tasks/gptchat/agentx/prompt \
            -run '^TestRender_ByteForByteCompatibility$' -count=1
          go test ./internal/tasks/gptchat/agentx/prompt \
            -run '^$' -bench '^BenchmarkReactRendererRender$' \
            -benchmem -cpu=1 -benchtime=1s -count=10 | tee /tmp/baseline.txt

          rm "$bench_file"
          git checkout --detach "$HEAD_SHA"
          go test ./internal/tasks/gptchat/agentx/prompt \
            -run '^TestRender_ByteForByteCompatibility$' -count=1
          go test ./internal/tasks/gptchat/agentx/prompt \
            -run '^$' -bench '^BenchmarkReactRendererRender$' \
            -benchmem -cpu=1 -benchtime=1s -count=10 | tee /tmp/optimized.txt

          python3 - <<'PY'
          import os
          import pathlib
          import re
          import statistics

          pattern = re.compile(
              r'^BenchmarkReactRendererRender(?:-\d+)?\s+\d+\s+'
              r'([\d.]+) ns/op.*?(\d+) B/op\s+(\d+) allocs/op$',
              re.MULTILINE,
          )

          def parse(path):
              rows = pattern.findall(pathlib.Path(path).read_text())
              if len(rows) != 10:
                  raise SystemExit(f'expected 10 benchmark rows in {path}, got {len(rows)}')
              ns = [float(row[0]) for row in rows]
              heap = [int(row[1]) for row in rows]
              allocs = [int(row[2]) for row in rows]
              return statistics.median(ns), statistics.median(heap), statistics.median(allocs)

          baseline = parse('/tmp/baseline.txt')
          optimized = parse('/tmp/optimized.txt')
          reductions = tuple(
              (before - after) / before * 100
              for before, after in zip(baseline, optimized)
          )
          speedup = baseline[0] / optimized[0]

          if any(after >= before for before, after in zip(baseline, optimized)):
              raise SystemExit(
                  f'optimization was not beneficial: baseline={baseline}, optimized={optimized}'
              )

          summary = (
              '## ReAct prompt benchmark (Go 1.27.0)\n\n'
              '| Metric | Baseline | Optimized | Improvement |\n'
              '|---|---:|---:|---:|\n'
              f'| Time | {baseline[0]:.2f} ns/op | {optimized[0]:.2f} ns/op | '
              f'{reductions[0]:.2f}% lower ({speedup:.2f}x faster) |\n'
              f'| Heap | {baseline[1]:.0f} B/op | {optimized[1]:.0f} B/op | '
              f'{reductions[1]:.2f}% lower |\n'
              f'| Allocations | {baseline[2]:.0f} allocs/op | {optimized[2]:.0f} allocs/op | '
              f'{reductions[2]:.2f}% lower |\n'
          )
          print(summary)
          pathlib.Path('/tmp/benchmark-summary.md').write_text(summary)
          description = (
              f'{baseline[0]:.0f}->{optimized[0]:.0f} ns/op; '
              f'{baseline[1]:.0f}->{optimized[1]:.0f} B/op; '
              f'{baseline[2]:.0f}->{optimized[2]:.0f} allocs/op'
          )
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'status_description={description}\n')
          PY
          cat /tmp/benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check optimized files are formatted
        shell: bash
        run: |
          test -z "$(gofmt -d \
            internal/tasks/gptchat/agentx/prompt/react.go \
            internal/tasks/gptchat/agentx/prompt/react_render_benchmark_test.go)"
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Run prompt unit and behavior tests
        run: go test ./internal/tasks/gptchat/agentx/prompt -count=1

  go-compatibility-and-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libssl-dev libasound2t64 wget
          sudo mkdir -p "$SPEECHSDK_ROOT"
          wget -q -O /tmp/SpeechSDK-Linux.tar.gz \
            https://csspeechstorage.blob.core.windows.net/drop/1.50.0/SpeechSDK-Linux-1.50.0.tar.gz
          sudo tar --strip 1 -xzf /tmp/SpeechSDK-Linux.tar.gz -C "$SPEECHSDK_ROOT"

      - name: Validate Go 1.27 declarations
        shell: bash
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          grep -Fx 'go 1.27.0' go.mod
          grep -F 'FROM golang:1.27.0-bookworm AS gobuild' Dockerfile
          grep -F 'Code targets **Go 1.27**' AGENTS.md
          grep -F -- '- Go 1.27+' docs/manual/dev.md

      - name: Run Go vet
        run: go vet ./...

      - name: Compare full Go suite package outcomes
        shell: bash
        run: |
          set -euo pipefail

          run_suite() {
            local ref=$1
            local label=$2
            git checkout --detach "$ref"
            git reset --hard
            git clean -fd
            go clean -testcache
            set +e
            go test -json ./... -count=1 >"/tmp/${label}.json" 2>&1
            printf '%s\n' "$?" >"/tmp/${label}.status"
            set -e
          }

          run_suite "$BASE_SHA" baseline-1
          run_suite "$HEAD_SHA" optimized-1
          run_suite "$BASE_SHA" baseline-2
          run_suite "$HEAD_SHA" optimized-2

          python3 - <<'PY'
          import json
          import pathlib

          labels = ('baseline-1', 'optimized-1', 'baseline-2', 'optimized-2')

          def failed_packages(label):
              failed = set()
              path = pathlib.Path(f'/tmp/{label}.json')
              for raw in path.read_text(errors='replace').splitlines():
                  try:
                      event = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if (
                      event.get('Action') == 'fail'
                      and event.get('Package')
                      and not event.get('Test')
                  ):
                      failed.add(event['Package'])
              return failed

          statuses = {
              label: int(pathlib.Path(f'/tmp/{label}.status').read_text())
              for label in labels
          }
          packages = {label: failed_packages(label) for label in labels}
          print('statuses:', statuses)
          for label in labels:
              print(label, sorted(packages[label]))

          if len(set(statuses.values())) != 1:
              raise SystemExit('full-suite exit status changed between revisions')
          if any(packages[label] != packages['baseline-1'] for label in labels[1:]):
              raise SystemExit('full-suite failed package set changed between revisions')

          changed_package = 'github.com/Laisky/go-ramjet/internal/tasks/gptchat/agentx/prompt'
          if changed_package in packages['baseline-1']:
              raise SystemExit('changed prompt package failed in the full suite')

          summary = (
              '## Full Go suite differential on Go 1.27.0\n\n'
              f'- Exit status: `{statuses["baseline-1"]}` in all four runs\n'
              f'- Existing failed packages: `{len(packages["baseline-1"])}` in all four runs\n'
              '- Failed package sets are identical between baseline and optimized revisions.\n'
              '- The changed prompt package passed in every run.\n'
          )
          pathlib.Path('/tmp/go-suite-summary.md').write_text(summary)
          PY
          cat /tmp/go-suite-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Install project analysis tools
        shell: bash
        run: |
          git checkout --detach "$HEAD_SHA"
          git reset --hard
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0

      - name: Check imports of changed Go files
        shell: bash
        run: |
          test -z "$(goimports -d \
            internal/tasks/gptchat/agentx/prompt/react.go \
            internal/tasks/gptchat/agentx/prompt/react_render_benchmark_test.go)"

      - name: Compare project lint target diagnostics
        shell: bash
        run: |
          set -euo pipefail

          run_lint() {
            local ref=$1
            local label=$2
            git checkout --detach "$ref"
            git reset --hard
            git clean -fd
            set +e
            make lint >"/tmp/${label}-lint.log" 2>&1
            printf '%s\n' "$?" >"/tmp/${label}-lint.status"
            set -e
          }

          run_lint "$BASE_SHA" baseline
          run_lint "$HEAD_SHA" optimized

          python3 - <<'PY'
          import collections
          import pathlib
          import re

          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          issue = re.compile(r'^(.+\.go):(\d+):(\d+): (.+) \(([^()]+)\)$')

          def parse(label):
              diagnostics = collections.Counter()
              text = ansi.sub(
                  '',
                  pathlib.Path(f'/tmp/{label}-lint.log').read_text(errors='replace'),
              )
              for line in text.splitlines():
                  match = issue.match(line)
                  if match:
                      path, _line, _column, message, linter = match.groups()
                      diagnostics[(path, message, linter)] += 1
              return diagnostics

          statuses = {
              label: int(pathlib.Path(f'/tmp/{label}-lint.status').read_text())
              for label in ('baseline', 'optimized')
          }
          baseline = parse('baseline')
          optimized = parse('optimized')
          print('lint statuses:', statuses)
          print('diagnostics:', sum(baseline.values()), sum(optimized.values()))

          if statuses['baseline'] != statuses['optimized']:
              raise SystemExit('project lint exit status changed')
          if baseline != optimized:
              print('added:', list((optimized - baseline).elements()))
              print('removed:', list((baseline - optimized).elements()))
              raise SystemExit('project lint diagnostics changed')
          if statuses['optimized'] != 0 and not optimized:
              raise SystemExit('project lint failed without parseable diagnostics')

          summary = (
              '## Project lint differential\n\n'
              f'- Baseline and optimized exit status: `{statuses["optimized"]}`\n'
              f'- Existing diagnostics: `{sum(optimized.values())}` on both revisions\n'
              '- Result: no new lint diagnostic.\n'
          )
          pathlib.Path('/tmp/lint-summary.md').write_text(summary)
          PY
          cat /tmp/lint-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Compare vulnerability findings
        shell: bash
        run: |
          set -euo pipefail

          run_scan() {
            local ref=$1
            local label=$2
            git checkout --detach "$ref"
            git reset --hard
            git clean -fd
            set +e
            govulncheck ./... >"/tmp/${label}-vuln.log" 2>&1
            printf '%s\n' "$?" >"/tmp/${label}-vuln.status"
            set -e
          }

          run_scan "$BASE_SHA" baseline
          run_scan "$HEAD_SHA" optimized

          python3 - <<'PY'
          import pathlib
          import re

          advisory = re.compile(r'GO-\d{4}-\d+')
          statuses = {
              label: int(pathlib.Path(f'/tmp/{label}-vuln.status').read_text())
              for label in ('baseline', 'optimized')
          }
          findings = {
              label: set(
                  advisory.findall(
                      pathlib.Path(f'/tmp/{label}-vuln.log').read_text(errors='replace')
                  )
              )
              for label in ('baseline', 'optimized')
          }
          print('vulnerability statuses:', statuses)
          print('baseline findings:', sorted(findings['baseline']))
          print('optimized findings:', sorted(findings['optimized']))

          if statuses['baseline'] != statuses['optimized']:
              raise SystemExit('govulncheck exit status changed')
          if findings['baseline'] != findings['optimized']:
              raise SystemExit('govulncheck advisory set changed')

          summary = (
              '## govulncheck differential\n\n'
              f'- Baseline and optimized exit status: `{statuses["optimized"]}`\n'
              f'- Advisory IDs: `{len(findings["optimized"])}` on both revisions\n'
              '- Result: no new vulnerability finding.\n'
          )
          pathlib.Path('/tmp/vuln-summary.md').write_text(summary)
          PY
          cat /tmp/vuln-summary.md >> "$GITHUB_STEP_SUMMARY"

  frontend-differential-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        shell: bash
        run: |
          corepack enable
          pnpm -C web install --frozen-lockfile

      - name: Confirm frontend source is unchanged
        run: git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- web

      - name: Compare stable frontend test failures
        shell: bash
        run: |
          set -euo pipefail

          run_tests() {
            local ref=$1
            local label=$2
            git checkout --detach "$ref"
            git reset --hard
            set +e
            pnpm -C web test >"/tmp/${label}-frontend.log" 2>&1
            printf '%s\n' "$?" >"/tmp/${label}-frontend.status"
            set -e
          }

          run_tests "$BASE_SHA" baseline-1
          run_tests "$HEAD_SHA" optimized-1
          run_tests "$BASE_SHA" baseline-2
          run_tests "$HEAD_SHA" optimized-2

          python3 - <<'PY'
          import pathlib
          import re

          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          labels = ('baseline-1', 'optimized-1', 'baseline-2', 'optimized-2')

          def failures(label):
              text = ansi.sub(
                  '',
                  pathlib.Path(f'/tmp/{label}-frontend.log').read_text(errors='replace'),
              )
              found = set()
              for raw in text.splitlines():
                  line = raw.strip()
                  if line.startswith('FAIL '):
                      found.add(re.sub(r'\s+\[[\d.]+ms\]\s*$', '', line[5:]).strip())
              return found

          statuses = {
              label: int(pathlib.Path(f'/tmp/{label}-frontend.status').read_text())
              for label in labels
          }
          observed = {label: failures(label) for label in labels}
          stable_baseline = observed['baseline-1'] & observed['baseline-2']
          stable_optimized = observed['optimized-1'] & observed['optimized-2']

          print('frontend statuses:', statuses)
          for label in labels:
              print(label, sorted(observed[label]))
          print('stable baseline:', sorted(stable_baseline))
          print('stable optimized:', sorted(stable_optimized))

          if stable_baseline != stable_optimized:
              raise SystemExit('stable frontend failure signatures changed')
          if any(status != 0 and not observed[label] for label, status in statuses.items()):
              raise SystemExit('frontend test failed without a parseable failure signature')

          summary = (
              '## Frontend test differential\n\n'
              f'- Stable baseline failures: `{len(stable_baseline)}`\n'
              f'- Stable optimized failures: `{len(stable_optimized)}`\n'
              '- The frontend source tree is unchanged.\n'
              '- Result: no stable frontend regression.\n'
          )
          pathlib.Path('/tmp/frontend-summary.md').write_text(summary)
          PY
          cat /tmp/frontend-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run frontend lint, formatting, and build
        shell: bash
        run: |
          git checkout --detach "$HEAD_SHA"
          git reset --hard
          pnpm -C web exec eslint .
          pnpm -C web exec prettier --check .
          pnpm -C web build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build Go 1.27 image without pushing
        run: docker build --tag go-ramjet:bolt-go127 .

  report:
    if: always()
    needs:
      - performance-and-correctness
      - go-compatibility-and-analysis
      - frontend-differential-and-build
      - docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Publish aggregate verification status
        env:
          GH_TOKEN: ${{ github.token }}
          PERF_RESULT: ${{ needs.performance-and-correctness.result }}
          GO_RESULT: ${{ needs.go-compatibility-and-analysis.result }}
          FRONTEND_RESULT: ${{ needs.frontend-differential-and-build.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          BENCHMARK_SUMMARY: ${{ needs.performance-and-correctness.outputs.benchmark_summary }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          for result in "$PERF_RESULT" "$GO_RESULT" "$FRONTEND_RESULT" "$DOCKER_RESULT"; do
            if [[ "$result" != success ]]; then
              state=failure
            fi
          done

          if [[ "$state" == success && -n "$BENCHMARK_SUMMARY" ]]; then
            description="$BENCHMARK_SUMMARY; Go 1.27 verified"
          else
            description="perf=$PERF_RESULT go=$GO_RESULT frontend=$FRONTEND_RESULT docker=$DOCKER_RESULT"
          fi
          description=${description:0:140}

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context=bolt/verification \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          [[ "$state" == success ]]
