name: consolidate-billing-once

on:
  push:
    branches: [fix/consolidate-useful-billing-20261008]
    paths: [.github/workflows/consolidate-billing-once.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/consolidate-useful-billing-20261008
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libasound2t64 libssl-dev
          curl --fail --location https://csspeechstorage.blob.core.windows.net/drop/1.52.0/SpeechSDK-Linux-1.52.0.tar.gz -o /tmp/speech.tar.gz
          sudo mkdir -p /opt/azure/speech
          sudo tar --strip-components=1 -xzf /tmp/speech.tar.gz -C /opt/azure/speech
          echo 'CGO_CFLAGS=-I/opt/azure/speech/include/c_api' >> "$GITHUB_ENV"
          echo 'CGO_LDFLAGS=-L/opt/azure/speech/lib/x64 -lMicrosoft.CognitiveServices.Speech.core' >> "$GITHUB_ENV"
          echo 'LD_LIBRARY_PATH=/opt/azure/speech/lib/x64' >> "$GITHUB_ENV"
      - name: Apply reviewed source patch and isolated fixture
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, gzip, hashlib, re, subprocess
          from pathlib import Path
          original = subprocess.check_output(['git', 'show', '1b796d91810be59e402db309d52839e44180bc90:.github/workflows/consolidate-billing-once.yml'], text=True)
          payload = re.search(r"payload = '([^']+)'", original).group(1)
          patch = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == '0b0cc6954da687b2485d727363255daf6615adc975c663786dfc82ecd5b4b6a4'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          path = Path('internal/tasks/gptchat/http/external_billing_test.go')
          text = path.read_text()
          old = '''oldClient, oldAPI := httpcli, config.Config.ExternalBillingAPI
          	httpcli = &http.Client{Transport: transport}
          	config.Config.ExternalBillingAPI = "https://billing.invalid"
          	t.Cleanup(func() {
          		httpcli, config.Config.ExternalBillingAPI = oldClient, oldAPI
          	})'''
          new = '''oldClient, oldConfig := httpcli, config.Config
          	httpcli = &http.Client{Transport: transport}
          	config.Config = &config.OpenAI{ExternalBillingAPI: "https://billing.invalid"}
          	t.Cleanup(func() {
          		httpcli, config.Config = oldClient, oldConfig
          	})'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          goimports -local github.com/Laisky/go-ramjet -w internal/tasks/gptchat/http/{external_billing,external_billing_test,image_flux,ramjet}.go
      - name: Run billing and Flux behavioral regressions
        run: go test ./internal/tasks/gptchat/http -run '^(TestExternalBilling|TestFluxGenerationBilling|TestFluxUnsupportedRequest)' -count=1 -v
      - name: Verify regression negative control
        shell: bash
        run: |
          cp internal/tasks/gptchat/http/external_billing.go /tmp/external_billing.go
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/tasks/gptchat/http/external_billing.go')
          s = p.read_text()
          assert s.count('json:"elapsed_time_ms,omitempty"') == 1
          p.write_text(s.replace('json:"elapsed_time_ms,omitempty"', 'json:"-"'))
          PY
          set +e
          go test ./internal/tasks/gptchat/http -run '^TestExternalBillingUsage$' -count=1 -v > /tmp/negative.log 2>&1
          result=$?
          set -e
          cp /tmp/external_billing.go internal/tasks/gptchat/http/external_billing.go
          cat /tmp/negative.log
          test "$result" -ne 0
          grep -q -- '--- FAIL: TestExternalBillingUsage/positive' /tmp/negative.log
      - name: Commit validated source without the temporary workflow
        run: |
          git rm .github/workflows/consolidate-billing-once.yml
          git add internal/tasks/gptchat/http/{external_billing,external_billing_test,image_flux,ramjet}.go
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(gptchat): retain useful billing latency without delaying upfront charges'
          git push --force-with-lease="refs/heads/fix/consolidate-useful-billing-20261008:$GITHUB_SHA" origin HEAD:fix/consolidate-useful-billing-20261008
          git log -1 --format='%H %s'
