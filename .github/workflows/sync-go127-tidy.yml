name: sync-go127-tidy

on:
  push:
    branches:
      - bolt/preallocate-react-prompt

permissions:
  contents: write

concurrency:
  group: sync-go127-tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'Laisky/go-ramjet'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch historical-base normalization and restore this workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git rev-parse origin/master)
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/bolt-verify.yml')
          text = path.read_text()

          def replace_once(old: str, new: str, description: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{description}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''          git checkout --detach "$BASE_SHA"
          cp /tmp/react_render_benchmark_test.go "$bench_file"
''',
              '''          git checkout --detach "$BASE_SHA"
          # PR #66 left this historical base with an unrelated module-path typo.
          # Normalize only dependency metadata; the baseline renderer remains unchanged.
          sed -i 's#github.com/alexcesar/go-bip39 v1.1.0#github.com/alexvec/go-bip39 v1.1.0#' go.mod
          grep -Fq 'github.com/alexvec/go-bip39 v1.1.0' go.mod
          cp /tmp/react_render_benchmark_test.go "$bench_file"
''',
              'benchmark base checkout',
          )
          replace_once(
              '''          rm "$bench_file"
          git checkout --detach "$HEAD_SHA"
''',
              '''          rm "$bench_file"
          git reset --hard
          git checkout --detach "$HEAD_SHA"
''',
              'benchmark head checkout',
          )

          for function in ('run_suite', 'run_make_lint', 'run_golangci', 'run_vuln'):
              old = f'''          {function}() {{
            local ref=$1 label=$2
            git reset --hard
            git clean -fd
            git checkout --detach "$ref"
'''
              new = old + '''            # Normalize the unrelated module-path typo in historical base revisions.
            sed -i 's#github.com/alexcesar/go-bip39 v1.1.0#github.com/alexvec/go-bip39 v1.1.0#' go.mod
            grep -Fq 'github.com/alexvec/go-bip39 v1.1.0' go.mod
'''
              replace_once(old, new, function)

          path.write_text(text)
          PY

          git show "$BASE_SHA:.github/workflows/sync-go127-tidy.yml" \
            > .github/workflows/sync-go127-tidy.yml
          git diff --check
          grep -Fq 'Normalize only dependency metadata; the baseline renderer remains unchanged.' \
            .github/workflows/bolt-verify.yml
          test "$(grep -c 'Normalize the unrelated module-path typo in historical base revisions.' \
            .github/workflows/bolt-verify.yml)" = 4

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/bolt-verify.yml .github/workflows/sync-go127-tidy.yml
          git commit -m "ci: normalize broken historical base metadata"
          git push origin "HEAD:${HEAD_BRANCH}"
