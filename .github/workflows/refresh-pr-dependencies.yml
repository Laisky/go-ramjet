name: Prepare dependency PR compatibility update

on:
  push:
    branches:
      - codex/resolve-dependency-prs-20261007
    paths:
      - .github/workflows/refresh-pr-dependencies.yml

permissions:
  contents: write

concurrency:
  group: prepare-dependency-prs-20261007
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Laisky/go-ramjet'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Repair compatible dependency ranges and connect diagram configuration
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version
          (cd web && pnpm --version)
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          const file = 'web/package.json'
          const pkg = JSON.parse(readFileSync(file, 'utf8'))
          for (const key of Object.keys(pkg.pnpm.overrides)) {
            pkg.pnpm.overrides[key] = `^${pkg.pnpm.overrides[key].replace(/^\^/, '')}`
          }
          pkg.pnpm.overrides['postcss@>=8.0.0 <8.5.10'] = '^8.5.10'
          writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`)
          JS
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path('web/src/components/markdown.tsx')
          text = path.read_text()
          pattern = r"        mermaid\.initialize\(\{\n.*?\n        \}\)"
          matches = re.findall(pattern, text, flags=re.S)
          if len(matches) != 1:
              raise SystemExit('Expected exactly one Mermaid initialization block')
          if 'createMermaidConfig' not in text:
              text = text.replace("import { cn } from '@/utils/cn'", "import { cn } from '@/utils/cn'\nimport { createMermaidConfig } from '@/utils/mermaid-config'")
          text = text.replace(matches[0], '        mermaid.initialize(createMermaidConfig(scheme))')
          path.write_text(text)
          PY
      - name: Regenerate the lockfile with strict peer compatibility
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C web install --no-frozen-lockfile --strict-peer-dependencies
          pnpm -C web exec prettier --write package.json pnpm-lock.yaml \
            src/components/markdown.tsx src/utils/mermaid-config.ts \
            src/utils/mermaid-config.test.ts src/utils/dependency-floors.test.ts
          pnpm -C web install --frozen-lockfile --strict-peer-dependencies
      - name: Reproduce the Mermaid regression without the compatibility setting
        shell: bash
        run: |
          set -euo pipefail
          cp web/src/utils/mermaid-config.ts /tmp/mermaid-config.fixed.ts
          trap 'cp /tmp/mermaid-config.fixed.ts web/src/utils/mermaid-config.ts' EXIT
          sed -i '/hierarchicalNamespaces: false,/d' web/src/utils/mermaid-config.ts
          if pnpm -C web exec vitest run src/utils/mermaid-config.test.ts --reporter=verbose > /tmp/mermaid-negative.txt 2>&1; then
            cat /tmp/mermaid-negative.txt
            echo 'Expected the historical configuration to fail the namespace regression test.'
            exit 1
          fi
          cat /tmp/mermaid-negative.txt
          grep -q 'preserves flat dotted namespaces' /tmp/mermaid-negative.txt
          grep -q 'AssertionError' /tmp/mermaid-negative.txt
      - name: Reproduce dependency-floor failures on the original lockfile
        shell: bash
        run: |
          set -euo pipefail
          cp web/pnpm-lock.yaml /tmp/pnpm-lock.fixed.yaml
          trap 'cp /tmp/pnpm-lock.fixed.yaml web/pnpm-lock.yaml' EXIT
          git show bb412454d66e9f66c6a49c409bdb335ffab5cb01:web/pnpm-lock.yaml > web/pnpm-lock.yaml
          if pnpm -C web exec vitest run src/utils/dependency-floors.test.ts --reporter=verbose > /tmp/dependency-negative.txt 2>&1; then
            cat /tmp/dependency-negative.txt
            echo 'Expected the original lockfile to fail dependency-floor regression tests.'
            exit 1
          fi
          cat /tmp/dependency-negative.txt
          grep -q 'regresses the minimum' /tmp/dependency-negative.txt
      - name: Verify the fixed regression tests and lint
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C web exec vitest run src/utils/mermaid-config.test.ts src/utils/dependency-floors.test.ts --reporter=verbose
          pnpm -C web exec eslint src/utils/mermaid-config.ts src/utils/mermaid-config.test.ts src/utils/dependency-floors.test.ts
      - name: Commit verified dependency and compatibility changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/package.json web/pnpm-lock.yaml web/src/components/markdown.tsx \
            web/src/utils/mermaid-config.ts web/src/utils/mermaid-config.test.ts \
            web/src/utils/dependency-floors.test.ts
          git diff --cached --stat
          git commit -m 'fix(web): reconcile peer ranges and preserve Mermaid namespace behavior'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "Prepared commit: $(git rev-parse HEAD)"
