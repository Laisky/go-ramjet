name: format-realtime-audio

on:
  push:
    branches:
      - feat/gptchat-realtime-audio-plugins

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/gptchat-realtime-audio-plugins

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          pnpm -C web install --frozen-lockfile

      - name: Format changed frontend files
        run: |
          pnpm -C web exec prettier --write \
            src/pages/gptchat/audio/__tests__/pcm-audio.test.ts \
            src/pages/gptchat/audio/__tests__/plugin-registry.test.ts \
            src/pages/gptchat/audio/__tests__/realtime-client.test.ts \
            src/pages/gptchat/audio/pcm-audio.ts \
            src/pages/gptchat/audio/plugin-registry.tsx \
            src/pages/gptchat/audio/plugin-types.ts \
            src/pages/gptchat/audio/realtime-client.ts \
            src/pages/gptchat/audio/realtime-plugin.tsx \
            src/pages/gptchat/audio/whisper-plugin.tsx \
            src/pages/gptchat/components/chat-input.tsx \
            src/pages/gptchat/types.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web
          git commit -m 'style(gptchat): format realtime audio changes'
          git push origin HEAD:feat/gptchat-realtime-audio-plugins
