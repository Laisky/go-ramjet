name: Prepare stable dependency upgrades

on:
  push:
    branches: [codex/latest-stable-dependencies-20261007]
    paths: [.github/workflows/prepare-stable-upgrades.yml]

permissions:
  contents: write

concurrency:
  group: prepare-stable-dependencies
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Correct regression fixtures and remove only unused directives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-frontend
          python3 <<'PY'
          from pathlib import Path
          path = Path('web/src/pages/gptchat/components/chat-input.tsx')
          text = path.read_text()
          # Restore the pre-existing external-draft exception; only the prefill
          # directive was reported as unused in the baseline lint comparison.
          comment = '      // eslint-disable-next-line react-hooks/set-state-in-effect -- synchronize an externally owned draft after session changes.\n'
          target = '      setMessage(draftMessage)\n'
          assert text.count(target) == 1 and comment not in text
          path.write_text(text.replace(target, comment + target))
          for name, comment in [
              ('chat-search.tsx', ' // eslint-disable-line react-hooks/set-state-in-effect -- reset on close'),
              ('image-editor-modal.tsx', ' // eslint-disable-line react-hooks/set-state-in-effect -- sync with canvas reset'),
              ('selection-toolbar.tsx', ' // eslint-disable-line react-hooks/set-state-in-effect -- DOM measurement sync'),
          ]:
              path = Path('web/src/pages/gptchat/components') / name
              text = path.read_text()
              assert text.count(comment) == 1
              path.write_text(text.replace(comment, ''))
          path = Path('web/src/pages/cv/dependency-lifecycle.test.tsx')
          text = path.read_text()
          target = "screen.getByTitle('Click to copy email')"
          assert text.count(target) == 1
          path.write_text(text.replace(target, "screen.getAllByTitle('Click to copy email')[0]"))
          path = Path('web/DEPENDENCIES.md')
          text = path.read_text().replace('Keep both entries.', 'The 6.0.2 compatibility package currently re-exports the locked 6.0.3 API.\nKeep both entries.')
          path.write_text(text)
          path = Path('docs/dependency-upgrade-2026-10.md')
          text = path.read_text() + '''\n## Remaining module-level advisory\n\nThe upgraded graph reports GO-2026-5932 for the unmaintained\n`golang.org/x/crypto/openpgp` package. That package is not imported by this\napplication, and the advisory has no fixed version. Other packages from the\nlatest `golang.org/x/crypto` module are still required. The scan reports zero\ncalled-code and imported-package vulnerabilities, not zero module advisories.\n'''
          path.write_text(text)
          PY
          corepack enable
          pnpm -C web install --frozen-lockfile --strict-peer-dependencies
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/master -- web | grep -E '\.(tsx?|jsx?|json|yaml|md)$' | sed 's@^web/@@')
          pnpm -C web exec prettier --write "${files[@]}" ../docs/dependency-upgrade-2026-10.md
      - name: Verify native compiler and supported API identity
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C web exec tsc --version | tee /tmp/final-frontend/compiler-version.log
          grep -F 'Version 7.0.2' /tmp/final-frontend/compiler-version.log
          pnpm -C web exec node --input-type=module -e '
            import ts from "typescript";
            console.log("Compiler API", ts.version);
            if (!/^6\.0\.\d+$/.test(ts.version) || typeof ts.createSourceFile !== "function") process.exit(1);
          ' | tee /tmp/final-frontend/compiler-api.log
      - name: Prove lifecycle regressions fail without the fixes
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess
          from pathlib import Path
          tests = ['src/pages/cv/dependency-lifecycle.test.tsx',
                   'src/pages/gptchat/hooks/__tests__/use-prompt-shortcuts.test.ts',
                   'src/pages/gptchat/components/__tests__/dataset-dependency.test.tsx']
          command = ['pnpm', '-C', 'web', 'exec', 'vitest', 'run', *tests, '--reporter=verbose']
          fixed = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          Path('/tmp/final-frontend/focused-fixed.log').write_text(fixed.stdout)
          if fixed.returncode: raise RuntimeError(fixed.stdout)
          paths = ['web/src/pages/cv/index.tsx',
                   'web/src/pages/gptchat/hooks/use-prompt-shortcuts.ts',
                   'web/src/pages/gptchat/components/dataset-manager.tsx']
          originals = {path: Path(path).read_bytes() for path in paths}
          try:
              for path in paths:
                  Path(path).write_bytes(subprocess.check_output(['git', 'show', '5896ce13cc8d78921f6a3238244786a8c4db5dc8:' + path]))
              negative = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              Path('/tmp/final-frontend/negative.log').write_text(negative.stdout)
              if negative.returncode == 0 or 'AssertionError' not in negative.stdout:
                  raise RuntimeError('The original code did not reproduce the expected lifecycle assertion failures')
              print('Lifecycle negative control passed: original code fails assertions.')
          finally:
              for path, content in originals.items(): Path(path).write_bytes(content)
          PY
      - name: Validate fixed full frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C web lint 2>&1 | tee /tmp/final-frontend/lint.log
          pnpm -C web test > /tmp/final-frontend/tests.log 2>&1
          pnpm -C web build > /tmp/final-frontend/build.log 2>&1
          git diff --check
      - name: Save validated changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web docs/dependency-upgrade-2026-10.md
          git commit -m 'test: validate stable toolchain identity and lifecycle regression controls'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          git rev-parse HEAD > /tmp/final-frontend/candidate-head.txt
      - name: Export source and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/final-frontend
          git ls-files -z -- '*.go' 'web/*' 'docs/*' 'go.mod' 'go.sum' 'Dockerfile' 'Makefile' 'package.json' '.golangci.yml' '.github/workflows/*' 'AGENTS.md' \
            | tar --null -T - -czf /tmp/final-frontend/review-source.tar.gz
          git diff --binary > /tmp/final-frontend/candidate.patch
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: stable-upgrade-final-frontend
          path: /tmp/final-frontend/
