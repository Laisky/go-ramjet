name: Prepare stable dependency upgrades

on:
  push:
    branches: [codex/latest-stable-dependencies-20261007]
    paths: [.github/workflows/prepare-stable-upgrades.yml]

permissions:
  contents: write

concurrency:
  group: prepare-stable-dependencies
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Apply reviewed API migrations and format source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upgrade-validation
          python3 .github/apply-stable-migrations.py
          rm .github/apply-stable-migrations.py
          go mod tidy
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          mapfile -t files < <(git diff --name-only origin/master -- '*.go')
          goimports -local github.com/Laisky/go-ramjet -w "${files[@]}"
          corepack enable
          pnpm -C web install --frozen-lockfile --strict-peer-dependencies
          pnpm -C web exec prettier --write src/test/dependency-lockfile.ts src/utils/dependency-floors.test.ts src/utils/package-manager.test.ts
      - name: Frontend validation and full-lint diagnostic
        shell: bash
        run: |
          set +e
          pnpm -C web test > /tmp/upgrade-validation/frontend-tests.log 2>&1
          echo "frontend tests: $?" >> /tmp/upgrade-validation/results.txt
          pnpm -C web build > /tmp/upgrade-validation/frontend-build.log 2>&1
          echo "frontend build: $?" >> /tmp/upgrade-validation/results.txt
          pnpm -C web exec eslint src/test/dependency-lockfile.ts src/utils/dependency-floors.test.ts src/utils/package-manager.test.ts > /tmp/upgrade-validation/changed-lint.log 2>&1
          echo "changed frontend lint: $?" >> /tmp/upgrade-validation/results.txt
          pnpm -C web exec eslint . -f json -o /tmp/upgrade-validation/current-lint.json
          echo "full frontend lint: $?" >> /tmp/upgrade-validation/results.txt
          exit 0
      - name: Compare unchanged baseline full-lint behavior
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/ramjet-baseline 9d0ed4a09536e1c7107838fabf24cf64e7330529
          cd /tmp/ramjet-baseline
          corepack pnpm -C web install --frozen-lockfile
          set +e
          corepack pnpm -C web exec eslint . -f json -o /tmp/upgrade-validation/baseline-lint.json
          echo "baseline full lint: $?" >> /tmp/upgrade-validation/results.txt
          exit 0
      - name: Install matching native and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev libasound2t64 poppler-utils wget
          command -v google-chrome || command -v chromium
          command -v pdftotext
          wget -q -O /tmp/speech.tar.gz 'https://csspeechstorage.blob.core.windows.net/drop/1.52.0/SpeechSDK-Linux-1.52.0.tar.gz'
          sudo mkdir -p /opt/azure/speech
          sudo tar --strip-components=1 -xzf /tmp/speech.tar.gz -C /opt/azure/speech
          {
            echo 'CGO_CFLAGS=-I/opt/azure/speech/include/c_api'
            echo 'CGO_LDFLAGS=-L/opt/azure/speech/lib/x64 -lMicrosoft.CognitiveServices.Speech.core'
            echo 'LD_LIBRARY_PATH=/opt/azure/speech/lib/x64'
          } >> "${GITHUB_ENV}"
      - name: Backend and real-browser validation
        env:
          CRAWLER_HTTP_PROXY: ''
        shell: bash
        run: |
          set +e
          go test ./... -count=1 > /tmp/upgrade-validation/backend-tests.log 2>&1
          echo "backend tests: $?" >> /tmp/upgrade-validation/results.txt
          go test -tags=browser_integration ./internal/tasks/cv ./internal/tasks/gptchat/tasks -run '^TestBrowser' -count=1 -v > /tmp/upgrade-validation/browser-tests.log 2>&1
          echo "browser tests: $?" >> /tmp/upgrade-validation/results.txt
          go vet ./... > /tmp/upgrade-validation/go-vet.log 2>&1
          echo "go vet: $?" >> /tmp/upgrade-validation/results.txt
          exit 0
      - name: Export review sources and save the candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upgrade-validation
          git ls-files -z -- '*.go' 'web/*' 'go.mod' 'go.sum' 'Dockerfile' 'package.json' '.golangci.yml' '.github/workflows/*' 'AGENTS.md' \
            | tar --null -T - -czf /tmp/upgrade-validation/review-source.tar.gz
          git diff --binary > /tmp/upgrade-validation/candidate.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.go' go.mod go.sum web/src/test/dependency-lockfile.ts web/src/utils/dependency-floors.test.ts web/src/utils/package-manager.test.ts .github/apply-stable-migrations.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: migrate browser and Markdown APIs and preserve dependency regression guards'
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
          git rev-parse HEAD > /tmp/upgrade-validation/candidate-head.txt
          cat /tmp/upgrade-validation/results.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: stable-upgrade-validation
          path: /tmp/upgrade-validation/
