name: Prepare stable dependency upgrades

on:
  push:
    branches: [codex/latest-stable-dependencies-20261007]
    paths: [.github/workflows/prepare-stable-upgrades.yml]

permissions:
  contents: write

concurrency:
  group: prepare-stable-dependencies
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Apply lifecycle refinements and format changed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upgrade-validation
          python3 .github/apply-stable-followup.py
          rm .github/apply-stable-followup.py
          go mod tidy
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          mapfile -t files < <(git diff --name-only origin/master -- '*.go')
          goimports -local github.com/Laisky/go-ramjet -w "${files[@]}"
          corepack enable
          pnpm -C web install --frozen-lockfile --strict-peer-dependencies
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/master -- web | grep -E '\.(tsx?|jsx?|json|yaml|md)$' | sed 's@^web/@@')
          pnpm -C web exec prettier --write "${files[@]}"
      - name: Frontend tests, compiler, and full lint
        shell: bash
        run: |
          set +e
          pnpm -C web test > /tmp/upgrade-validation/frontend-tests.log 2>&1
          echo "frontend tests: $?" >> /tmp/upgrade-validation/results.txt
          pnpm -C web build > /tmp/upgrade-validation/frontend-build.log 2>&1
          echo "frontend build: $?" >> /tmp/upgrade-validation/results.txt
          pnpm -C web exec eslint . -f json -o /tmp/upgrade-validation/current-lint.json
          echo "full frontend lint: $?" >> /tmp/upgrade-validation/results.txt
          exit 0
      - name: Native SDK and browser setup
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev libasound2t64 poppler-utils wget
          wget -q -O /tmp/speech.tar.gz 'https://csspeechstorage.blob.core.windows.net/drop/1.52.0/SpeechSDK-Linux-1.52.0.tar.gz'
          sudo mkdir -p /opt/azure/speech
          sudo tar --strip-components=1 -xzf /tmp/speech.tar.gz -C /opt/azure/speech
          {
            echo 'CGO_CFLAGS=-I/opt/azure/speech/include/c_api'
            echo 'CGO_LDFLAGS=-L/opt/azure/speech/lib/x64 -lMicrosoft.CognitiveServices.Speech.core'
            echo 'LD_LIBRARY_PATH=/opt/azure/speech/lib/x64'
          } >> "${GITHUB_ENV}"
      - name: Isolate browser startup from application logic
        shell: bash
        run: |
          set -euo pipefail
          for executable in headless_shell headless-shell chromium chromium-browser google-chrome google-chrome-stable /opt/google/chrome/chrome; do
            if command -v "${executable}"; then
              timeout 5 "${executable}" --version || true
            fi
          done > /tmp/upgrade-validation/browser-environment.log 2>&1
          cat > /tmp/browser-probe.go <<'GO'
          package main
          import (
            "context"
            "fmt"
            "log"
            "os"
            "time"
            "github.com/chromedp/chromedp"
          )
          func probe(path string) {
            fmt.Println("PROBE", path)
            ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
            defer cancel()
            options := append(chromedp.DefaultExecAllocatorOptions[:], chromedp.NoSandbox, chromedp.CombinedOutput(os.Stdout))
            if path != "default" { options = append(options, chromedp.ExecPath(path)) }
            allocator, stop := chromedp.NewExecAllocator(ctx, options...)
            defer stop()
            browser, closeBrowser := chromedp.NewContext(allocator, chromedp.WithDebugf(log.Printf))
            defer closeBrowser()
            title, err := chromedp.Run(browser, chromedp.Title())
            fmt.Printf("RESULT %s title=%q error=%v\n", path, title, err)
          }
          func main() {
            probe("default")
            probe("google-chrome")
            if _, err := os.Stat("/opt/google/chrome/chrome"); err == nil { probe("/opt/google/chrome/chrome") }
          }
          GO
          go run /tmp/browser-probe.go > /tmp/upgrade-validation/browser-probe.log 2>&1
      - name: Backend, payment, browser, and security validation
        env:
          CRAWLER_HTTP_PROXY: ''
        shell: bash
        run: |
          set +e
          go test ./... -count=1 > /tmp/upgrade-validation/backend-tests.log 2>&1
          echo "backend tests: $?" >> /tmp/upgrade-validation/results.txt
          go test -tags=browser_integration ./internal/tasks/cv ./internal/tasks/gptchat/tasks -run '^TestBrowser' -count=1 -v > /tmp/upgrade-validation/browser-tests.log 2>&1
          echo "browser tests: $?" >> /tmp/upgrade-validation/results.txt
          go vet ./... > /tmp/upgrade-validation/go-vet.log 2>&1
          echo "go vet: $?" >> /tmp/upgrade-validation/results.txt
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 && golangci-lint run -c .golangci.yml > /tmp/upgrade-validation/go-lint.log 2>&1
          echo "go lint: $?" >> /tmp/upgrade-validation/results.txt
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0 && govulncheck ./... > /tmp/upgrade-validation/go-vuln.log 2>&1
          echo "govulncheck: $?" >> /tmp/upgrade-validation/results.txt
          exit 0
      - name: Export diagnostics and save candidate source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upgrade-validation
          git ls-files -z -- '*.go' 'web/*' 'go.mod' 'go.sum' 'Dockerfile' 'package.json' '.golangci.yml' '.github/workflows/*' 'AGENTS.md' \
            | tar --null -T - -czf /tmp/upgrade-validation/review-source.tar.gz
          git diff --binary > /tmp/upgrade-validation/candidate.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.go' go.mod go.sum web .github/apply-stable-followup.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve React lifecycle and stable dependency contracts'
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
          git rev-parse HEAD > /tmp/upgrade-validation/candidate-head.txt
          cat /tmp/upgrade-validation/results.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: stable-upgrade-validation
          path: /tmp/upgrade-validation/
