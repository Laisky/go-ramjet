name: Prepare stable dependency upgrades

on:
  push:
    branches: [codex/latest-stable-dependencies-20261007]
    paths: [.github/workflows/prepare-stable-upgrades.yml]

permissions:
  contents: write

concurrency:
  group: prepare-stable-dependencies
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Inventory current and stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stable-audit
          go list -m -u -json all > /tmp/stable-audit/go-modules.json
          python3 <<'PY'
          import concurrent.futures
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          def load_url(url):
              """load_url reads public registry metadata and returns decoded JSON."""
              headers = {'User-Agent': 'go-ramjet-dependency-audit'}
              if url.startswith('https://api.github.com/'):
                  headers['Authorization'] = 'Bearer ' + os.environ['GH_TOKEN']
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
                  return json.load(response)

          def npm_version(name):
              """npm_version returns the stable latest-tag version and peer metadata."""
              metadata = load_url('https://registry.npmjs.org/' + urllib.parse.quote(name, safe='') + '/latest')
              version = metadata['version']
              if not re.fullmatch(r'\d+\.\d+\.\d+', version):
                  raise ValueError(f'{name}: latest tag is not stable: {version}')
              return name, {key: metadata.get(key) for key in ['version', 'engines', 'peerDependencies', 'deprecated']}

          manifest = json.loads(Path('web/package.json').read_text())
          names = list(dict.fromkeys([*manifest['dependencies'], *manifest['devDependencies'], 'pnpm']))
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
              npm = dict(executor.map(npm_version, names))
          text = Path('/tmp/stable-audit/go-modules.json').read_text()
          decoder = json.JSONDecoder()
          modules = []
          while text.strip():
              module, offset = decoder.raw_decode(text.lstrip())
              modules.append(module)
              text = text.lstrip()[offset:]

          def latest_release(module):
              """latest_release discovers a direct GitHub module's released major without changing imports."""
              path = module['Path']
              if not path.startswith('github.com/'):
                  return path, None
              repo = '/'.join(path.split('/')[1:3])
              try:
                  data = load_url('https://api.github.com/repos/' + repo + '/releases/latest')
                  return path, {'tag': data['tag_name'], 'url': data['html_url'], 'published': data['published_at']}
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return path, {'note': 'No GitHub release; use Go module tags.'}
                  raise

          direct = [module for module in modules if not module.get('Main') and not module.get('Indirect')]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as executor:
              releases = dict(executor.map(latest_release, direct))
          report = {'go_releases': load_url('https://go.dev/dl/?mode=json'), 'npm': npm,
                    'go_modules': modules, 'direct_github_releases': releases}
          Path('/tmp/stable-audit/inventory.json').write_text(json.dumps(report, indent=2) + '\n')
          lines = ['# Stable dependency inventory', '', '## Toolchain', '']
          lines += [entry['version'] for entry in report['go_releases'] if entry['stable']]
          lines += ['', '## Frontend latest stable versions', '', '| Package | Current range | Latest | Peers / engines |', '|---|---|---|---|']
          for name, item in npm.items():
              current = manifest['dependencies'].get(name, manifest['devDependencies'].get(name, manifest['packageManager']))
              lines.append(f"| {name} | {current} | {item['version']} | {json.dumps({'peers': item['peerDependencies'], 'engines': item['engines'], 'deprecated': item['deprecated']})} |")
          lines += ['', '## Go direct dependencies', '', '| Module | Current | Update in module path | Latest repository release |', '|---|---|---|---|']
          for module in direct:
              lines.append(f"| {module['Path']} | {module.get('Version')} | {module.get('Update', {}).get('Version', '-')} | {json.dumps(releases[module['Path']])} |")
          lines += ['', '## Go transitive updates', '']
          for module in modules:
              if module.get('Indirect') and module.get('Update'):
                  lines.append(f"- {module['Path']}: {module['Version']} -> {module['Update']['Version']}")
          lines += ['', '## Repository instruction and build files', '']
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          lines += [path for path in paths if Path(path).name in ['AGENTS.md', 'go.mod', 'package.json', 'pnpm-workspace.yaml'] or path.startswith('.github/workflows/')]
          Path('STABLE_UPGRADE_STATUS.md').write_text('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: stable-dependency-inventory
          path: /tmp/stable-audit/
      - name: Save inventory to the upgrade branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STABLE_UPGRADE_STATUS.md
          git commit -m 'docs: record stable release inventory for dependency migration'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
