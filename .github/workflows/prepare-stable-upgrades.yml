name: Prepare stable dependency upgrades

on:
  push:
    branches: [codex/latest-stable-dependencies-20261007]
    paths: [.github/workflows/prepare-stable-upgrades.yml]

permissions:
  contents: write

concurrency:
  group: prepare-stable-dependencies
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Complete generated dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upgrade-review
          corepack enable
          python3 <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path
          for path in Path('.').rglob('*.go'):
              source = path.read_text()
              updated = source.replace('html-to-markdown/v2/v2', 'html-to-markdown/v2').replace('goldmark/v2/v2', 'goldmark/v2')
              if updated != source:
                  path.write_text(updated)
          path = Path('web/tsconfig.app.json')
          source = path.read_text().replace('    "baseUrl": ".",\n', '').replace('"@/*": ["src/*"]', '"@/*": ["./src/*"]')
          path.write_text(source)
          with urllib.request.urlopen('https://registry.npmjs.org/yaml/latest', timeout=60) as response:
              yaml = json.load(response)
          assert re.fullmatch(r'\d+\.\d+\.\d+', yaml['version']) and not yaml.get('deprecated')
          path = Path('web/package.json')
          pkg = json.loads(path.read_text())
          pkg['devDependencies']['yaml'] = '^' + yaml['version']
          path.write_text(json.dumps(pkg, indent=2) + '\n')
          Path('/tmp/upgrade-review/yaml-release.json').write_text(json.dumps(yaml, indent=2))
          path = Path('Dockerfile')
          source = path.read_text().replace('golang:1.27.0-bookworm', 'golang:1.27.1-bookworm').replace('node:24-bookworm', 'node:24.21.0-bookworm')
          source = re.sub(r'ARG SPEECHSDK_VERSION=[0-9.]+', 'ARG SPEECHSDK_VERSION=1.52.0', source)
          path.write_text(source.replace('RUN corepack enable || true', 'RUN corepack enable'))
          PY
          go get github.com/phpdave11/gofpdf@95d7704723b18e9b55cd71b234a2e40815e990d6 \
            github.com/yuin/goldmark@v1.8.6 github.com/deckarep/golang-set/v2@v2.9.0 \
            go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.72.0 \
            go.opentelemetry.io/otel/sdk@v1.47.0
          go mod tidy
          pnpm -C web install --no-frozen-lockfile --strict-peer-dependencies
          pnpm -C web exec prettier --write package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.app.json
          pnpm -C web install --frozen-lockfile --strict-peer-dependencies
      - name: Export review sources before publishing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upgrade-review/upstream
          git ls-files -z -- '*.go' 'web/*' 'go.mod' 'go.sum' 'Dockerfile' 'package.json' '.golangci.yml' '.github/workflows/*' 'AGENTS.md' \
            | tar --null -T - -czf /tmp/upgrade-review/review-source.tar.gz
          for module in github.com/chromedp/chromedp github.com/chromedp/cdproto github.com/yuin/goldmark/v2; do
            dir="$(go list -m -f '{{.Dir}}' "${module}")"
            name="${module//\//_}"
            tar -C "${dir}" -czf "/tmp/upgrade-review/upstream/${name}.tar.gz" .
          done
          git diff --binary > /tmp/upgrade-review/candidate.patch
          git rev-parse HEAD > /tmp/upgrade-review/source-head.txt
      - name: Save generated application files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- go.mod go.sum Dockerfile web/package.json web/pnpm-lock.yaml web/pnpm-workspace.yaml web/tsconfig.app.json
          git add -- '*.go'
          if ! git diff --cached --quiet; then
            git commit -m 'build: persist stable dependency graph and TypeScript configuration migration'
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: stable-upgrade-review
          path: /tmp/upgrade-review/
