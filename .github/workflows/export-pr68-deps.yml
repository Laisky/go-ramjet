name: export-pr68-deps

on:
  push:
    branches:
      - tmp/export-pr68-source

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          pnpm -C web install --frozen-lockfile

      - name: Archive dependencies
        run: tar -czf /tmp/web-node-modules.tar.gz -C web node_modules

      - name: Upload dependency archive
        uses: actions/upload-artifact@v5
        with:
          name: pr68-web-node-modules
          path: /tmp/web-node-modules.tar.gz
          retention-days: 1
